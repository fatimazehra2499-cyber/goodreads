plugins {
    id 'application'
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.example.booktracker.Main'
}

dependencies {
    implementation 'org.mongodb:mongodb-driver-sync:4.11.1'
}
